<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>GemType harness (mocked backend)</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 760px; margin: 40px auto; padding: 0 20px; }
    textarea { width: 100%; box-sizing: border-box; font-size: 15px; padding: 10px; border: 1px solid #ccc; border-radius: 8px; }
    [contenteditable] { border: 1px solid #ccc; border-radius: 8px; padding: 12px; min-height: 100px; font-size: 15px; line-height: 1.5; }
    label { display: block; font-weight: 600; margin: 24px 0 6px; }
  </style>
</head>
<body>
  <h1>GemType harness — mocked Gemini</h1>
  <p>Content scripts loaded directly with a fake <code>chrome</code> API. No real API calls.</p>

  <div style="margin: 20px 0; padding: 12px 16px; background: #f6f8fa; border: 1px solid #d0d7de; border-radius: 8px;">
    <label style="margin: 0; display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; font-weight: 500;">
      <input type="checkbox" id="previewToggle" checked />
      Preview before replace (interactive preview tooltip with Enter / Esc controls)
    </label>
  </div>

  <label>Textarea</label>
  <textarea id="ta" rows="4">She dont like going their on the weekends. Me and him goes there sometime.</textarea>

  <label>contenteditable</label>
  <div id="ce" contenteditable="true">
    <div>Thank you for you're quick response.</div>
    <div>Their are a few thing I want to discuss.</div>
  </div>

  <script>
    // ---- fake chrome API -------------------------------------------------
    const MOCK_PRESETS = [
      { id: 'formal', label: 'Formal', prompt: 'Rewrite this in a professional, polished, and formal tone:' },
      { id: 'concise', label: 'Concise', prompt: 'Make this text significantly shorter and punchier without losing essential facts:' },
      { id: 'fix', label: 'Fix & Polish', prompt: 'Correct all spelling, punctuation, and grammar mistakes while preserving voice:' },
      { id: 'improve', label: 'Improve', prompt: 'Rewrite the text to be clearer and better written while keeping the tone and meaning:' },
      { id: 'casual', label: 'Casual', prompt: 'Rewrite the text in a friendly, casual, conversational tone:' },
      { id: 'pirate', label: 'Pirate Talk', prompt: 'Rewrite the text like a salty pirate:' },
    ];

    const MOCK_CORRECTIONS = {
      // keyed by a distinctive substring of the checked text
      'She dont': [
        { original: 'dont', replacement: "doesn't", explanation: 'Missing apostrophe; subject-verb agreement', type: 'grammar' },
        { original: 'their', replacement: 'there', explanation: 'Wrong homophone', type: 'spelling' },
        { original: 'Me and him goes', replacement: 'He and I go', explanation: 'Pronoun case and agreement', type: 'grammar' },
      ],
      "you're quick": [
        { original: "you're", replacement: 'your', explanation: 'Possessive, not contraction', type: 'grammar' },
        { original: 'Their are a few thing', replacement: 'There are a few things', explanation: 'Homophone and plural', type: 'grammar' },
      ],
    };

    window.__mockLog = [];
    window.chrome = {
      runtime: {
        lastError: null,
        sendMessage(msg) {
          window.__mockLog.push(msg.type);
          return new Promise((resolve) => setTimeout(() => {
            if (msg.type === 'GET_SETTINGS') {
              const toggle = document.getElementById('previewToggle');
              const previewBeforeReplace = toggle ? toggle.checked : true;
              resolve({
                ok: true,
                result: {
                  enabled: true,
                  apiKey: 'FAKE',
                  model: 'mock',
                  disabledSites: [],
                  language: 'auto',
                  previewBeforeReplace,
                  customPresets: MOCK_PRESETS,
                },
              });
            } else if (msg.type === 'CHECK_TEXT') {
              let corrections = [];
              for (const key in MOCK_CORRECTIONS) {
                if (msg.text.includes(key)) corrections = MOCK_CORRECTIONS[key];
              }
              resolve({ ok: true, result: { corrections } });
            } else if (msg.type === 'REFINE_TEXT') {
              resolve({ ok: true, result: { rewritten: `[${msg.action.toUpperCase()}] ${msg.text}` } });
            } else {
              resolve({ ok: true, result: true });
            }
          }, 150));
        },
        onMessage: { addListener() {} },
      },
      storage: {
        local: {
          get: async () => ({
            apiKey: 'FAKE',
            gemtype_secrets: { apiKey: 'FAKE' },
          }),
          set: async () => {},
        },
        sync: {
          get: async () => ({
            gemtype_config: {
              previewBeforeReplace: true,
              customPresets: MOCK_PRESETS,
            },
          }),
          set: async () => {},
        },
        onChanged: { addListener() {} },
      },
    };

    document.getElementById('previewToggle').addEventListener('change', (e) => {
      if (window.GT && window.GT.state && window.GT.state.settings) {
        window.GT.state.settings.previewBeforeReplace = e.target.checked;
      }
    });
  </script>
  <script src="../extension/src/content/util.js"></script>
  <script src="../extension/src/content/overlay.js"></script>
  <script src="../extension/src/content/refine.js"></script>
  <script src="../extension/src/content/content.js"></script>
</body>
</html>
