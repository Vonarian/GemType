<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>GemType harness — late-init composer (LinkedIn pattern)</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 760px; margin: 40px auto; padding: 0 20px; }
    #late { border: 1px solid #ccc; border-radius: 8px; padding: 12px; min-height: 90px; font-size: 15px; line-height: 1.5; }
    label { display: block; font-weight: 600; margin: 24px 0 6px; }
    #status { margin-top: 20px; font-family: ui-monospace, monospace; font-size: 13px; white-space: pre-wrap; background:#f5f5f5; padding:12px; border-radius:8px; }
  </style>
</head>
<body>
  <h1>Late-init composer repro</h1>
  <p>The box below is a plain &lt;div&gt; that becomes <code>contenteditable</code> only AFTER its first focus — exactly like LinkedIn's Quill "Start a post" editor. Focus-only detection misses it; the input-driven fallback should catch it.</p>

  <label>Composer (upgrades on focus)</label>
  <div id="late" tabindex="0" role="textbox" data-placeholder="Start a post…">Start a post…</div>

  <div id="status">status: waiting…</div>

  <script>
    // LinkedIn/Quill pattern: the element is NOT contenteditable when focus
    // first lands; a script upgrades it right after focus.
    const late = document.getElementById('late');
    late.addEventListener('focus', () => {
      if (late.getAttribute('contenteditable') !== 'true') {
        late.textContent = '';
        late.setAttribute('contenteditable', 'true');
      }
    }, { once: true });

    // ---- fake chrome API (same as harness.html) --------------------------
    const MOCK_CORRECTIONS = {
      'She dont': [
        { original: 'dont', replacement: "doesn't", explanation: 'apostrophe', type: 'grammar' },
        { original: 'their', replacement: 'there', explanation: 'homophone', type: 'spelling' },
      ],
    };
    window.__mockLog = [];
    window.chrome = {
      runtime: {
        lastError: null,
        sendMessage(msg) {
          window.__mockLog.push(msg.type);
          return new Promise((resolve) => setTimeout(() => {
            if (msg.type === 'GET_SETTINGS') {
              resolve({ ok: true, result: { enabled: true, apiKey: 'FAKE', model: 'mock', disabledSites: [], language: 'auto' } });
            } else if (msg.type === 'CHECK_TEXT') {
              let corrections = [];
              for (const key in MOCK_CORRECTIONS) if (msg.text.includes(key)) corrections = MOCK_CORRECTIONS[key];
              resolve({ ok: true, result: { corrections } });
            } else { resolve({ ok: true, result: true }); }
          }, 120));
        },
        onMessage: { addListener() {} },
      },
      storage: { local: { get: async () => ({}), set: async () => {} }, onChanged: { addListener() {} } },
    };
  </script>
  <script src="../extension/src/content/util.js"></script>
  <script src="../extension/src/content/overlay.js"></script>
  <script src="../extension/src/content/refine.js"></script>
  <script src="../extension/src/content/content.js"></script>
</body>
</html>
